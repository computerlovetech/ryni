site_name: Rýni
site_description: A linter for your agent harness.
docs_dir: website
repo_url: https://github.com/computerlovetech/ryni
repo_name: computerlovetech/ryni
edit_uri: edit/main/website/
strict: true
nav:
  - Home: index.md
  - Your first rule pack: first-rule-pack.md
theme:
  name: material
  font: false
  palette:
    - scheme: default
      primary: custom
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest
    - search.highlight
plugins:
  - search
markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.inlinehilite
  - toc:
      permalink: true
extra_css:
  - stylesheets/extra.css
