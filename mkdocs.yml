site_name: Rýni
site_url: https://computerlovetech.github.io/ryni/
site_description: A harness linter, written in Rust.
docs_dir: website
exclude_docs: |
  overrides/
repo_url: https://github.com/computerlovetech/ryni
repo_name: computerlovetech/ryni
edit_uri: edit/main/website/
strict: true
nav:
  - Home: index.md
  - Getting started:
      - Installation: installation.md
      - CLI usage: usage.md
  - Reference:
      - Built-in rules: rules.md
      - Configuration and packs: configuration.md
      - JSON output and fixes: output.md
  - Development:
      - Architecture: architecture.md
theme:
  name: material
  custom_dir: website/overrides
  logo: assets/ryni-logo.png
  favicon: assets/ryni-logo.png
  font: false
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest
    - search.highlight
plugins:
  - search
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.inlinehilite
  - toc:
      permalink: true
extra_css:
  - stylesheets/extra.css
