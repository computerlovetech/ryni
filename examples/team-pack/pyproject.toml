[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "ryni-example-team"
version = "0.1.0"
description = "An example Rýni pack: explicit setup and accurate test instructions"
requires-python = ">=3.14"
dependencies = ["ryni>=0.1.1"]

[project.entry-points."ryni.rules"]
team = "team_harness:PACK"

[tool.hatch.build.targets.wheel]
packages = ["src/team_harness"]
