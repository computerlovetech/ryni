name: Checks

on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:
    inputs:
      upload-distributions:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: '3.14'
          enable-cache: true
      - run: uv sync --locked --group docs
      - run: uv run --no-sync python scripts/release.py
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync pytest tests
      - name: Test tidy-harness against the local Rýni API
        run: uv run --with-editable . --with-editable ./examples/tidy-harness pytest examples/tidy-harness/tests
      - run: uv run --no-sync ryni check .
      - run: uv run --no-sync mkdocs build --strict
      - run: uv build --no-sources --out-dir "$RUNNER_TEMP/release-dist"
      - name: Verify installed wheel and bundled skill
        run: |
          version=$(uv run --no-sync python scripts/release.py)
          uv run --isolated --no-project \
            --with "$RUNNER_TEMP"/release-dist/*.whl \
            python scripts/smoke_release.py "$version"
      - name: Save tested distributions for publishing
        if: inputs.upload-distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-dist
          path: ${{ runner.temp }}/release-dist/
          if-no-files-found: error
          overwrite: true
