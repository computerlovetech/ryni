name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: '3.14'
          enable-cache: true
      - run: uv sync --locked --group docs
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync pytest tests
      - name: Test tidy-harness against the local Rýni API
        run: uv run --with-editable . --with ./examples/tidy-harness pytest examples/tidy-harness/tests
      - run: uv run --no-sync ryni check .
      - run: uv run --no-sync mkdocs build --strict
      - run: uv build
      - run: uv build examples/tidy-harness --out-dir examples/tidy-harness/dist
      - name: Verify installed wheel and bundled skill
        run: uvx --from dist/ryni-*-py3-none-any.whl ryni skill install "$RUNNER_TEMP/ryni-skills"
