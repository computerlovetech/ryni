name: Publish
run-name: ${{ github.event_name == 'push' && format('Release {0}', github.ref_name) || format('Release dry run on {0}', github.ref_name) }}

on:
  push:
    tags: ['v*']
  # Manual runs always validate and build only, including when run on a tag.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      prerelease: ${{ steps.metadata.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: '3.14'
      - run: uv sync --locked
      - name: Validate metadata before any upload
        id: metadata
        env:
          EVENT_NAME: ${{ github.event_name }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          args=()
          if [[ "$EVENT_NAME" == push ]]; then
            git merge-base --is-ancestor HEAD origin/main
            args+=(--tag "$TAG_NAME")
          fi
          version=$(uv run --no-sync python scripts/release.py "${args[@]}" \
            --notes-file "$RUNNER_TEMP/release-notes.md")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" =~ (a|b|rc)[0-9]+$ ]]; then
            echo 'prerelease=true' >> "$GITHUB_OUTPUT"
          else
            echo 'prerelease=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-notes
          path: ${{ runner.temp }}/release-notes.md
          if-no-files-found: error
          overwrite: true

  checks:
    needs: validate
    uses: ./.github/workflows/ci.yml
    with:
      upload-distributions: true

  publish:
    needs: checks
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/ryni/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-dist
          path: dist
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.11.17'
      # Re-running a partial upload skips only byte-identical files on PyPI.
      - name: Publish ryni
        run: >-
          uv publish --trusted-publishing always --check-url https://pypi.org/simple/
          dist/*.whl dist/*.tar.gz

  release:
    needs: [validate, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.validate.outputs.version }}
      PRERELEASE: ${{ needs.validate.outputs.prerelease }}
      TAG_NAME: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: '3.14'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-notes
          path: notes
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-dist
          path: dist
      - name: Verify a fresh installation from PyPI
        run: |
          for attempt in {1..6}; do
            if uv run --isolated --no-project --no-cache \
              --default-index https://pypi.org/simple/ \
              --with "ryni==$VERSION" \
              python scripts/smoke_release.py "$VERSION"; then
              exit 0
            fi
            if [[ "$attempt" -lt 6 ]]; then sleep 10; fi
          done
          exit 1
      - name: Create GitHub Release with tested distributions
        run: |
          if ! gh release view "$TAG_NAME" >/dev/null 2>&1; then
            args=()
            if [[ "$PRERELEASE" == true ]]; then args+=(--prerelease); fi
            gh release create "$TAG_NAME" --verify-tag --title "$TAG_NAME" \
              --notes-file notes/release-notes.md "${args[@]}" \
              dist/*.whl dist/*.tar.gz
          fi
