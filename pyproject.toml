[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "ryni"
version = "0.1.0"
description = "An opinionated linter for agent harnesses"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "typer>=0.20",
    "pyyaml>=6",
    "pydantic>=2.13.5",
]

[project.scripts]
ryni = "ryni.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/ryni"]

[tool.ruff]
line-length = 100

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.12",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
