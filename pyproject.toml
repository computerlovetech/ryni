[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "ryni"
version = "0.1.1"
description = "Share conventions. Catch harness drift."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "typer>=0.20",
    "pyyaml>=6",
]

[project.scripts]
ryni = "ryni.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/ryni"]

[tool.ruff]
line-length = 100

[dependency-groups]
dev = [
    "packaging>=26",
    "pytest>=9.0.3",
    "ruff>=0.15.12",
]

docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.6,<10",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
